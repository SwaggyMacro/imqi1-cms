# 带 Redis 版本：应用 + PostgreSQL + Redis 7。是否启用 Redis 由「选这套文件」决定
# （Dockerfile 里烘焙 REDIS_ENABLED=true / REDIS_HOST=redis），与 .env 无关。
# 需要改 host / 端口 / 密码 / DB 时在构建命令里覆盖，例如：
#   docker compose --env-file .env -f docker/docker-compose.yml build --build-arg REDIS_HOST=10.0.0.5
# 运行：项目根目录执行 docker compose --env-file .env -f docker/docker-compose.yml up -d --build

# 固定项目名（默认取配置文件所在目录名），决定卷名前缀，两套文件保持一致。
name: imqi1-cms

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Redis 构建期烘焙：默认值与 Dockerfile 一致，列出以便用环境变量或
        # `--build-arg` 覆盖（CLI 优先级高于此处）。REDIS_PASSWORD 同时被下方
        # redis 服务读取，保证应用与 redis 服务密码一致。
        REDIS_ENABLED: ${REDIS_ENABLED:-true}
        REDIS_HOST: ${REDIS_HOST:-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        REDIS_DB: ${REDIS_DB:-0}
    image: imqi1-cms:latest
    container_name: imqi1-app
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-3000}:3000"
    environment:
      # 运行时容器内不注入 Redis 变量（构建期已烘焙）；如 shell/.env 里设了 REDIS_* 也不会被进程读取。
      DB_HOST: postgres
      DB_PORT: "5432"
      # 容器内上传目录固定；UPLOADS_DIR（.env）表示宿主演路径，见下方 volumes。
      UPLOADS_DIR: /app/.output/public/uploads
    env_file:
      - ../.env
    volumes:
      # 本地上传目录 bind mount：宿主 UPLOADS_DIR（默认项目根/uploads）→ 容器内 /app/.output/public/uploads
      - ${UPLOADS_DIR:-../uploads}:/app/.output/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: imqi1-postgres
    restart: unless-stopped
    environment:
      # 单用户即超级用户；应用与 healthcheck 均用 DB_USER（PG 无 MySQL 的 root/普通用户分权）。
      POSTGRES_USER: ${DB_USER:-imqi1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-imqi1-cms}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 卷为空时首次启动自动执行 init-db.sql（建表 + 默认数据）；卷已有数据则跳过。
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      # pg_isready 无需密码，仅探测服务可接受连接；就绪后才启动 app。
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-imqi1}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: imqi1-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
